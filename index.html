<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Trạm Đọc Thông Minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="data-snapshot.js"></script>
</head>
<body>
<header>
    <b>📚 Trạm Đọc Thông Minh</b>
    <nav>
        <button id="tS" class="on">👩‍🎓 Học sinh</button>
        <button id="tT">👩‍🏫 Giáo viên</button>
    </nav>
</header>

<main id="app"></main>
<canvas id="confetti-canvas"></canvas>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NL = String.fromCharCode(10);

let DEMO = false, iv = null, S = null;
let NAME = '', GR = null;
const T = n => DEMO ? Math.min(n, 3) : n;

const LESSONS = window.LESSONS || {};
const GRADES = [1, 2, 3, 4, 5];
const BOOKS = { sgk: 'Sách giáo khoa Tiếng Việt', vm: 'Sách văn mẫu', nc: 'Sách nâng cao' };
const ICON = { sgk: '📖', vm: '📝', nc: '🚀' };

const lname = k => LESSONS[k] ? `Lớp ${LESSONS[k].grade} · ${LESSONS[k].title}` : k;
const L = () => LESSONS[S.lid];

/* ===== LƯU TRỮ LOCALSTORAGE ===== */
const load = () => { try { return JSON.parse(localStorage.getItem('vtd_v4') || '[]'); } catch(e) { return []; } };
const store = r => { try { localStorage.setItem('vtd_v4', JSON.stringify(r)); } catch(e) {} };

function upsert() {
    if (!S || !L()) return;
    const rs = load(), n = L().stations.length;
    const rec = {
        name: S.name, lid: S.lid,
        status: S.done ? 'Hoàn thành' : `Đang đọc (Trạm ${Math.min(S.i + 1, n)}/${n})`,
        secs: S.secs, ok: S.ok, tot: S.tot, rush: S.rush, mic: S.mic
    };
    const i = rs.findIndex(x => x.name === S.name && x.lid === S.lid);
    i > -1 ? rs[i] = rec : rs.push(rec);
    store(rs);
}

setInterval(() => {
    if (S && !S.done && !document.hidden && $('#tS').classList.contains('on')) S.secs++;
}, 1000);

/* ===== ÂM THANH & HIỆU ỨNG ===== */
function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'success') {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.12);
            g.gain.setValueAtTime(0.25, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc.start(); osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'error') {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'sawtooth'; osc.connect(g); g.connect(ctx.destination);
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            g.gain.setValueAtTime(0.25, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'victory') {
            [440, 554, 659, 880].forEach((freq, idx) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = freq;
                g.gain.setValueAtTime(0, ctx.currentTime);
                g.gain.linearRampToValueAtTime(0.25, ctx.currentTime + idx * 0.1 + 0.05);
                g.gain.linearRampToValueAtTime(0, ctx.currentTime + idx * 0.1 + 0.3);
                o.start(ctx.currentTime + idx * 0.1); o.stop(ctx.currentTime + idx * 0.1 + 0.3);
            });
        }
    } catch(e) {}
}

const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };

function showConfetti() {
    const canvas = $('#confetti-canvas');
    canvas.style.display = 'block'; canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    const particles = Array.from({length: 120}, () => ({
        x: canvas.width / 2, y: canvas.height,
        r: Math.random() * 7 + 4, dx: Math.random() * 14 - 7, dy: Math.random() * -14 - 5,
        color: `hsl(${Math.random() * 360}, 100%, 50%)`
    }));
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
            p.dy += 0.3; p.x += p.dx; p.y += p.dy;
            if (p.y < canvas.height) active = true;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color; ctx.fill();
        });
        if (active) requestAnimationFrame(render); else canvas.style.display = 'none';
    }
    render();
}

const norm = s => s.toLowerCase().replace(/[^\p{L}\s]/gu, '').split(/\s+/).filter(Boolean);
function sim(a, b) {
    const A = norm(a), pool = norm(b);
    let h = 0;
    A.forEach(w => { const i = pool.indexOf(w); if (i > -1) { h++; pool.splice(i, 1); } });
    return A.length ? h / A.length : 0;
}
const shuf = a => [...a].sort(() => Math.random() - 0.5);

function countdown(sec, el, done) {
    clearInterval(iv);
    let n = T(sec);
    if (n <= 0) { done(); return; }
    const show = () => el.textContent = `⏳ Em đọc kỹ bài nhé… câu hỏi mở khóa sau ${n} giây`;
    show();
    iv = setInterval(() => {
        if (document.hidden) return;
        n--;
        if (n <= 0) { clearInterval(iv); el.textContent = ''; done(); }
        else show();
    }, 1000);
}

/* ===== HÀM HIỂN THỊ KHỔ THƠ CHIA 2 CỘT NHƯ SÁCH GIÁO KHOA ===== */
function formatPoemStanzasHTML(rawText, lineRenderer) {
    const normalized = String(rawText).replace(/\r\n/g, NL);
    const stanzas = normalized.split(/\n\s*\n|\s*\/\/\s*/).filter(s => s.trim() !== '');
    const wrapClass = stanzas.length > 1 ? 'poem-grid' : 'poem-single';
    const stanzasHTML = stanzas.map((stanza, sIdx) => {
        const lines = stanza.split(/\r?\n/).filter(l => l.trim() !== '');
        const linesHTML = lines.map((line, lIdx) => lineRenderer(line.trim(), sIdx, lIdx)).join('');
        return `<div class="stanza">${linesHTML}</div>`;
    }).join('');
    return `<div class="${wrapClass}">${stanzasHTML}</div>`;
}

/* ===== MÀN HÌNH HỌC SINH ===== */
function home() {
    clearInterval(iv); S = null;
    const fx = (location.hash.match(/bai=([^&]+)/) || [])[1];
    const fixed = LESSONS[fx] ? fx : null;
    const rs = load();
    const isDone = k => rs.some(r => r.name === NAME && r.lid === k && r.status === 'Hoàn thành');

    const demo = `<label class="ck"><input type="checkbox" id="dm" ${DEMO ? 'checked' : ''}> Chế độ Giáo viên xem thử (rút ngắn thời gian chờ xuống 3 giây)</label>`;
    const nm = `<input id="nm" maxlength="40" autocomplete="off" placeholder="👉 Nhập tên của em vào đây..." value="${esc(NAME)}">`;

    if (fixed) {
        app.innerHTML = `<div class="card">
            <h2>🔔 Cô giáo giao bài đọc cho em</h2>
            <p class="big">${esc(lname(fixed))}</p>
            <label>Tên của em là gì?</label>${nm}
            <button id="go">🚀 Bắt đầu vượt trạm!</button>
            <p style="margin-top:16px">${demo}</p>
        </div>`;
        $('#nm').oninput = e => NAME = e.target.value.trim();
        $('#go').onclick = () => begin(fixed);
        return;
    }

    const kids = GR ? Object.keys(LESSONS).filter(k => LESSONS[k].grade === GR) : [];
    const list = Object.keys(BOOKS).map(b => {
        const ls = kids.filter(k => LESSONS[k].book === b);
        return ls.length ? `<h3>${ICON[b] || '📚'} ${BOOKS[b]}</h3>` + ls.map(k =>
            `<button class="opt ls" data-k="${k}">
                <span>${esc(LESSONS[k].title)} <small style="color:#7f8c8d">(${LESSONS[k].stations.length} trạm${LESSONS[k].isPoem ? ' · Bài thơ' : ''})</small></span>
                ${isDone(k) ? '<span style="color:var(--ok);font-weight:900">✓ Đã xong</span>' : '<span>👉 Vào đọc</span>'}
            </button>`
        ).join('') : '';
    }).join('');

    app.innerHTML = `
        <div class="card">
            <h2>1️⃣ Tên của em là gì?</h2>${nm}
        </div>
        <div class="card">
            <h2>2️⃣ Em học lớp mấy?</h2>
            <div class="grades">
                ${GRADES.map(g => {
                    const n = Object.values(LESSONS).filter(l => l.grade === g).length;
                    return `<button class="gr ${g === GR ? 'sel' : ''}" data-g="${g}" ${n ? '' : 'disabled'}>
                        Lớp ${g}<small>${n ? n + ' bài' : 'Sắp có'}</small>
                    </button>`;
                }).join('')}
            </div>
        </div>
        <div class="card">
            <h2>3️⃣ Chọn bài đọc ${GR ? '(Lớp ' + GR + ')' : ''}</h2>
            ${GR ? (list || '<p class="sm">Lớp này chưa có bài.</p>') : '<p class="sm" style="color:var(--bad);font-weight:700">☝️ Em chọn khối lớp ở bước 2 trước nhé.</p>'}
        </div>
        <div class="card">${demo}</div>`;

    $('#nm').oninput = e => NAME = e.target.value.trim();
    app.querySelectorAll('.gr').forEach(b => b.onclick = () => { GR = +b.dataset.g; home(); });
    app.querySelectorAll('.ls').forEach(b => b.onclick = () => begin(b.dataset.k));
}

function begin(k) {
    NAME = $('#nm').value.trim();
    DEMO = $('#dm') ? $('#dm').checked : DEMO;
    if (!NAME) { $('#nm').focus(); $('#nm').style.borderColor = 'var(--bad)'; return; }
    S = { name: NAME, lid: k, i: 0, secs: 0, ok: 0, tot: 0, rush: 0, mic: null, done: false };
    upsert();
    station();
}

function trail() {
    const n = L().stations.length;
    return `<div class="trail">
        ${L().stations.map((_, i) => `<div class="dot ${i < S.i ? 'ok' : i === S.i ? 'now' : ''}">${i < S.i ? '✓' : i + 1}</div>`).join('<span>―</span>')}
        ${L().mic ? `<span>―</span><div class="dot ${S.i >= n ? 'now' : ''}">🎤</div>` : ''}
    </div>`;
}

function finishStation(firstOk) {
    S.tot++; if (firstOk) S.ok++; S.i++; upsert();
    const last = S.i >= L().stations.length;
    $('#act').innerHTML = `<div class="msg ok" style="font-size:22px;text-align:center">🎉 Giỏi lắm! Em đã vượt qua trạm này.</div>
        <div style="text-align:center"><button id="nx">${last ? (L().mic ? 'Đến trạm Đọc To 🎤' : 'Nhận Thẻ Bài ⭐') : 'Sang Trạm Tiếp Theo ➜'}</button></div>`;
    playSound('success');
    $('#nx').onclick = () => last ? (L().mic ? micStep() : finish()) : station();
}

function triggerCooldown(el, timeSecs, msg) {
    playSound('error');
    if (el) shake(el);
    const overlay = $('#cooldown-screen');
    const timeSpan = $('#cd-time');
    $('#cd-msg').textContent = msg;
    overlay.style.display = 'flex';
    let timeLeft = T(timeSecs);
    timeSpan.innerText = timeLeft;
    const timer = setInterval(() => {
        timeLeft--;
        timeSpan.innerText = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timer);
            overlay.style.display = 'none';
        }
    }, 1000);
}

function station() {
    const st = L().stations[S.i];
    const isPoem = !!L().isPoem;
    let wrong = 0;

    app.innerHTML = `<div class="card">
        ${trail()}
        <div class="cooldown-overlay" id="cooldown-screen">
            <div>⚠️ Chưa chính xác rồi!</div>
            <div class="cd-subtext" id="cd-msg"></div>
            <div class="cd-subtext">Em hãy đọc kỹ lại bài và đợi <span id="cd-time" style="color:#ffe66d;font-size:1.4em"></span> giây nhé!</div>
        </div>
        <div id="rd" class="read ${isPoem ? 'is-poem' : ''}"></div>
        <div id="act"></div>
    </div>`;

    const rd = $('#rd'), act = $('#act');

    // 1. DẠNG TAP (Tìm câu văn / khổ thơ)
    if (st.k === 'tap') {
        if (isPoem) {
            const wrapClass = st.s.length > 2 ? 'poem-grid' : 'poem-single';
            rd.innerHTML = `<div class="${wrapClass}">` + st.s.map((x, i) => {
                const lines = esc(x).split(/\r?\n/).map(l => `<span class="verse-line">${l}</span>`).join('');
                return `<div class="stanza sn" data-i="${i}">${lines}</div>`;
            }).join('') + `</div>`;
        } else {
            rd.innerHTML = st.s.map((x, i) => `<span class="sn" data-i="${i}">${esc(x)} </span>`).join('');
        }
        act.innerHTML = '<div class="msg" id="cd" style="text-align:center"></div>';
        countdown(st.min, $('#cd'), () => {
            act.innerHTML = `<div class="big">🔍 ${esc(st.q)}</div>`;
            rd.querySelectorAll('.sn').forEach(sp => {
                sp.classList.add('tap');
                sp.onclick = () => {
                    if ($('#cooldown-screen').style.display === 'flex') return;
                    if (+sp.dataset.i === st.a) {
                        sp.classList.add('good');
                        rd.querySelectorAll('.sn').forEach(x => x.onclick = null);
                        finishStation(wrong === 0);
                    } else {
                        wrong++; S.rush++;
                        sp.classList.add('hint');
                        triggerCooldown(sp, 5, 'Đoạn/câu này chưa phải là đáp án đúng.');
                    }
                };
            });
        });
    }

    // 2. DẠNG CHOICE (Trắc nghiệm)
    else if (st.k === 'choice') {
        if (isPoem) {
            rd.innerHTML = formatPoemStanzasHTML(st.t, line => `<span class="verse-line">${esc(line)}</span>`);
        } else {
            rd.textContent = st.t;
        }
        act.innerHTML = '<div class="msg" id="cd" style="text-align:center"></div>';
        countdown(st.min, $('#cd'), () => {
            act.innerHTML = `<div class="big">🤔 ${esc(st.q)}</div>` +
                st.o.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');
            act.querySelectorAll('.opt').forEach(b => {
                b.onclick = () => {
                    if ($('#cooldown-screen').style.display === 'flex') return;
                    if (+b.dataset.i === st.a) {
                        b.classList.add('done');
                        act.querySelectorAll('.opt').forEach(x => x.disabled = true);
                        finishStation(wrong === 0);
                    } else {
                        wrong++; S.rush++;
                        triggerCooldown(b, 5, 'Đáp án này chưa đúng với nội dung bài đọc.');
                    }
                };
            });
        });
    }

    // 3. DẠNG GOLD (Săn từ vựng bỏ vào giỏ)
    else if (st.k === 'gold') {
        const got = new Set();
        let tot = 0;
        const tokenizeLine = line => line.split(/\s+/).filter(Boolean).map(tk => {
            const m = tk.match(/^([*~]?)([^.,!?;:"“”()]+)([.,!?;:"“”()]*)$/);
            if (!m) return esc(tk);
            const g = m[1] === '*' ? 1 : m[1] === '~' ? 2 : 0;
            if (g === 1) tot++;
            const w = m[2].replace(/_/g, ' ');
            return `<span class="w" data-g="${g}" data-w="${esc(w)}">${esc(w)}</span>${esc(m[3])}`;
        }).join(' ');

        if (isPoem) {
            rd.innerHTML = formatPoemStanzasHTML(st.t, line => `<span class="verse-line">${tokenizeLine(line)}</span>`);
        } else {
            rd.innerHTML = tokenizeLine(st.t);
        }

        act.innerHTML = `<div class="big" style="color:#d35400">🧺 ${esc(st.q)}</div>
            <div class="basket" id="bk"><span class="sm">Giỏ từ vựng của em (0/${tot})</span></div>`;

        rd.querySelectorAll('.w').forEach(sp => {
            sp.onclick = () => {
                if ($('#cooldown-screen').style.display === 'flex' || sp.classList.contains('got')) return;
                if (sp.dataset.g === '2') {
                    wrong++; S.rush++;
                    triggerCooldown(sp, 4, `Từ "${sp.dataset.w}" cũng hay, nhưng em hãy tìm đúng từ theo câu hỏi nhé!`);
                } else if (sp.dataset.g === '1') {
                    sp.classList.add('got');
                    got.add(sp.dataset.w);
                    playSound('success');
                    $('#bk').insertAdjacentHTML('beforeend', `<span class="chip">${esc(sp.dataset.w)}</span>`);
                    $('#bk').querySelector('.sm').textContent = `Giỏ từ vựng của em (${got.size}/${tot})`;
                    if (got.size === tot) {
                        rd.querySelectorAll('.w').forEach(x => x.onclick = null);
                        setTimeout(() => finishStation(wrong === 0), 600);
                    }
                } else {
                    wrong++; S.rush++;
                    triggerCooldown(sp, 6, `Từ "${sp.dataset.w}" chưa phải từ cần thu hoạch rồi!`);
                }
            };
        });
    }

    // 4. DẠNG MATCH (Nối 2 cột)
    else if (st.k === 'match') {
        if (isPoem) {
            rd.innerHTML = formatPoemStanzasHTML(st.t, line => `<span class="verse-line">${esc(line)}</span>`);
        } else {
            rd.textContent = st.t;
        }
        act.innerHTML = '<div class="msg" id="cd" style="text-align:center"></div>';
        countdown(st.min, $('#cd'), () => {
            rd.classList.add('dim');
            const L2 = st.p.map((p, i) => [p[0], i]);
            const R = shuf(st.p.map((p, i) => [p[1], i]));
            let sel = null, done = 0;
            act.innerHTML = `<div class="big">🔗 ${esc(st.q)}</div>
                <div class="cols">
                    <div id="cl">${L2.map(x => `<button class="opt" data-i="${x[1]}">${esc(x[0])}</button>`).join('')}</div>
                    <div id="cr">${R.map(x => `<button class="opt" data-i="${x[1]}">${esc(x[0])}</button>`).join('')}</div>
                </div>`;
            const bl = [...$('#cl').children], br = [...$('#cr').children];
            bl.forEach(b => b.onclick = () => {
                if (b.classList.contains('done')) return;
                bl.forEach(x => x.classList.remove('sel'));
                b.classList.add('sel');
                sel = b;
            });
            br.forEach(b => b.onclick = () => {
                if (!sel || b.classList.contains('done') || $('#cooldown-screen').style.display === 'flex') return;
                if (sel.dataset.i === b.dataset.i) {
                    sel.classList.remove('sel'); sel.classList.add('done');
                    b.classList.add('done'); sel = null;
                    playSound('success');
                    if (++done === st.p.length) finishStation(wrong === 0);
                } else {
                    wrong++; S.rush++;
                    triggerCooldown(b, 5, 'Hai vế này chưa khớp với bài đọc rồi!');
                }
            });
        });
    }
}

/* ===== ĐỌC TO BẰNG MICRO ===== */
function micStep() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    app.innerHTML = `<div class="card">
        ${trail()}
        <h2 style="color:#16a085">🎤 Đọc Vang Mở Khóa!</h2>
        <p>Em hãy bấm Micro và đọc to, rõ ràng câu dưới đây nhé:</p>
        <div class="big-target">${esc(L().mic)}</div>
        <div style="text-align:center;margin:24px 0">
            ${SR ? `<button id="mc" class="mic-btn" style="font-size:20px;padding:15px 32px">🎙️ Bấm để đọc</button>` : ''}
        </div>
        <div class="msg" id="ms" style="text-align:center"></div>
        <div style="text-align:center;margin-top:20px">
            <button id="pr" style="background:#fff;border:2px solid var(--ln);box-shadow:none">👨‍👩‍👧 Con đã đọc to cho bố/mẹ nghe (Phụ huynh xác nhận)</button>
        </div>
    </div>`;

    $('#pr').onclick = () => { S.mic = 'PH xác nhận'; finish(); };
    if (!SR) return;

    $('#mc').onclick = () => {
        const ms = $('#ms');
        const r = new SR();
        r.lang = 'vi-VN'; r.maxAlternatives = 3;
        r.onstart = () => { ms.textContent = '🎧 Đang nghe em đọc...'; };
        r.onresult = e => {
            let best = 0, text = '';
            for (const alt of e.results[0]) {
                const score = sim(L().mic, alt.transcript);
                if (score >= best) { best = score; text = alt.transcript; }
            }
            const p = Math.round(best * 100);
            if (p >= 65) {
                S.mic = p;
                ms.className = 'msg ok';
                ms.textContent = `🎉 Em đọc rất rõ ràng (${p}%)!`;
                playSound('victory'); showConfetti();
                setTimeout(finish, 1800);
            } else {
                ms.className = 'msg bad';
                ms.textContent = `😅 Máy mới nghe được ${p}% ("${text}"). Em đọc to và rõ hơn nhé!`;
            }
        };
        r.onerror = () => { ms.className = 'msg bad'; ms.textContent = '⚠️ Không nhận được Micro. Em kiểm tra quyền Micro nhé!'; };
        try { r.start(); } catch(e) {}
    };
}

function finish() {
    S.done = true; upsert();
    const r = S.tot ? S.ok / S.tot : 0;
    const stars = r >= 0.7 ? 3 : r >= 0.4 ? 2 : 1;
    app.innerHTML = `<div class="card" style="text-align:center;padding:36px 20px">
        <h2>🏅 Chúc mừng ${esc(S.name)}!</h2>
        <div style="font-size:64px;margin:15px 0">${'⭐'.repeat(stars)}</div>
        <p class="big">${stars === 3 ? 'Tuyệt vời! Em đọc bài rất kỹ và hiểu bài sâu sắc.' : 'Em đã hoàn thành bài đọc!'}</p>
        <p class="sm">${esc(lname(S.lid))}</p>
        <button id="again">📚 Đọc bài khác</button>
    </div>`;
    playSound('victory'); showConfetti();
    $('#again').onclick = home;
}

/* ===== MÀN HÌNH GIÁO VIÊN ===== */
const mmss = s => `${Math.floor(s / 60)} phút ${String(s % 60).padStart(2, '0')} giây`;
const okLbl = p => p >= 80 ? '(Rất tốt)' : p >= 50 ? '(Đạt)' : '(Đọc vội)';
const micLbl = m => m == null ? 'Chưa đọc' : typeof m === 'string' ? m : `${m}%`;

function teacher() {
    clearInterval(iv);
    const rs = load();
    const base = location.href.split('#')[0];
    const gradesWithLessons = GRADES.filter(g => Object.values(LESSONS).some(l => l.grade === g));

    app.innerHTML = `<div class="card">
        <h2>1. Giao bài đọc về nhà</h2>
        <div class="cols">
            <label>Khối lớp:<select id="ag">${gradesWithLessons.map(g => `<option value="${g}">Lớp ${g}</option>`).join('')}</select></label>
            <label>Chọn bài:<select id="al"></select></label>
        </div>
        <label>Đường link gửi học sinh / nhóm Zalo phụ huynh:
            <div style="display:flex;gap:10px;margin-top:6px">
                <input id="lk" readonly style="margin:0;background:#f8f9fa">
                <button id="cp">📋 Sao chép</button>
            </div>
        </label>
    </div>
    <div class="card">
        <h2>2. Báo cáo kết quả đọc hiểu</h2>
        <div class="row">
            <button id="ex" style="background:var(--ok);color:#fff;box-shadow:none">📥 Xuất file CSV (Excel)</button>
            <button id="sp" style="background:#fff;border:2px solid var(--ln);box-shadow:none">🧪 Nạp dữ liệu mẫu</button>
            <button id="cl" style="background:var(--bad);color:#fff;box-shadow:none">🗑️ Xóa dữ liệu máy này</button>
        </div>
        <div class="tw">
            <table>
                <thead><tr><th>Học sinh</th><th>Bài đọc</th><th>Trạng thái</th><th>Thời gian</th><th>Đúng lần đầu</th><th>Bấm vội</th><th>Đọc to</th></tr></thead>
                <tbody>
                    ${rs.length ? rs.map(r => {
                        const p = r.tot ? Math.round(r.ok / r.tot * 100) : 0;
                        return `<tr>
                            <td><b>${esc(r.name)}</b></td>
                            <td>${esc(lname(r.lid))}</td>
                            <td>${esc(r.status)}</td>
                            <td>${mmss(r.secs)}</td>
                            <td>${r.tot ? p + '% ' + okLbl(p) : '—'}</td>
                            <td>${r.rush} lỗi</td>
                            <td>${micLbl(r.mic)}</td>
                        </tr>`;
                    }).join('') : '<tr><td colspan="7" style="text-align:center;padding:24px">Chưa có dữ liệu học sinh làm bài.</td></tr>'}
                </tbody>
            </table>
        </div>
    </div>`;

    const sync = () => { if ($('#al').value) $('#lk').value = `${base}#bai=${$('#al').value}`; };
    const fill = () => {
        $('#al').innerHTML = Object.keys(LESSONS).filter(k => LESSONS[k].grade == $('#ag').value)
            .map(k => `<option value="${k}">${ICON[LESSONS[k].book] || '📚'} ${esc(LESSONS[k].title)}</option>`).join('');
        sync();
    };
    if (gradesWithLessons.length) { $('#ag').onchange = fill; $('#al').onchange = sync; fill(); }

    $('#cp').onclick = () => {
        navigator.clipboard && navigator.clipboard.writeText($('#lk').value);
        $('#cp').textContent = '✅ Đã chép!';
    };
    $('#sp').onclick = () => {
        store([
            {name: 'Nguyễn Hồng Thắng', lid: 'L4_Dieu_ki_dieu', status: 'Hoàn thành', secs: 165, ok: 3, tot: 3, rush: 0, mic: 94},
            {name: 'Lê Bảo Anh', lid: 'L4_Ta_chu_cho_Mi_lu', status: 'Hoàn thành', secs: 210, ok: 2, tot: 3, rush: 1, mic: 88}
        ]);
        teacher();
    };
    $('#cl').onclick = () => { if (confirm('Xóa toàn bộ dữ liệu trên máy này?')) { store([]); teacher(); } };
    $('#ex').onclick = () => {
        const h = ['Hoc sinh', 'Bai doc', 'Trang thai', 'Giay doc', 'Dung lan dau (%)', 'Bam voi', 'Doc to'];
        const q = v => `"${String(v).replace(/"/g, '""')}"`;
        const rows = rs.map(r => [r.name, lname(r.lid), r.status, r.secs, r.tot ? Math.round(r.ok / r.tot * 100) : '', r.rush, r.mic ?? ''].map(q).join(','));
        const csvContent = '\uFEFF' + [h.map(q).join(','), ...rows].join(NL);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csvContent], {type: 'text/csv;charset=utf-8;'}));
        a.download = 'Bao_Cao_Doc_Sach.csv';
        a.click();
    };
}

$('#tS').onclick = () => { $('#tS').classList.add('on'); $('#tT').classList.remove('on'); (!S || S.done) ? home() : S.i >= L().stations.length ? (L().mic ? micStep() : finish()) : station(); };
$('#tT').onclick = () => { $('#tT').classList.add('on'); $('#tS').classList.remove('on'); teacher(); };

home();
</script>
</body>
</html>
